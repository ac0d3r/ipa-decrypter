name: Lint Web

on:
  push:
    branches:
      - main
    paths:
      - "web/**"
      - ".github/workflows/lint-web.yml"
  pull_request:
    paths:
      - "web/**"
      - ".github/workflows/lint-web.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build
