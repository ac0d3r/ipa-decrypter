name: Lint Web

on:
  push:
    branches:
      - main
    paths:
      - "web/**"
      - ".github/workflows/lint-web.yml"
  pull_request:
    paths:
      - "web/**"
      - ".github/workflows/lint-web.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build
