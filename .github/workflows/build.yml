name: Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  # Resolve image tags and dependency versions once for both architectures.
  resolve:
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.tags.outputs.image }}
      tags: ${{ steps.tags.outputs.tags }}
      push: ${{ steps.tags.outputs.push }}
      ipatool_version: ${{ steps.ipatool.outputs.ipatool_version }}
    steps:
      # Resolve the ipatool version up front so the build-arg (and thus the layer
      # cache key) changes only when a new ipatool release is out; the Dockerfile
      # default "latest" would otherwise be frozen by a cache hit.
      - id: ipatool
        name: Resolve latest ipatool version
        run: |
          IPATOOL_VERSION="$(git ls-remote --tags --sort=-v:refname https://github.com/majd/ipatool.git \
            | grep -v '\^{}' | head -n1 | awk -F/ '{print $NF}')"
          [ -n "$IPATOOL_VERSION" ] || { echo "failed to resolve ipatool version" >&2; exit 1; }
          echo "Building ipatool ${IPATOOL_VERSION}" >&2
          echo "ipatool_version=$IPATOOL_VERSION" >> "$GITHUB_OUTPUT"

      - id: tags
        name: Resolve image tags
        env:
          IS_TAG: ${{ startsWith(github.ref, 'refs/tags/') }}
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/ipa-decrypter"
          TAGS="$IMAGE:${GITHUB_REF_NAME}"
          if [[ "$IS_TAG" == "true" ]]; then
            TAGS="$TAGS,$IMAGE:latest"
          fi
          echo "Building image ${TAGS}" >&2
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"
          echo "tags=$TAGS" >> "$GITHUB_OUTPUT"
          echo "push=$IS_TAG" >> "$GITHUB_OUTPUT"

  # Build each architecture natively (amd64 on ubuntu-latest, arm64 on
  # ubuntu-24.04-arm); no QEMU emulation involved.
  build:
    needs: resolve
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            arch: amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Repository name only, no version tag. Each arch is pushed by digest;
      # the merge job attaches the version tags to the multi-arch manifest.
      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ matrix.platform }}
          pull: true
          tags: ${{ needs.resolve.outputs.push == 'true' && needs.resolve.outputs.image || '' }}
          outputs: ${{ needs.resolve.outputs.push == 'true' && 'type=image,push-by-digest=true,name-canonical=true,push=true' || '' }}
          build-args: |
            IPATOOL_VERSION=${{ needs.resolve.outputs.ipatool_version }}
            VERSION=${{ github.ref_name }}
          cache-from: type=gha,scope=build-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=build-${{ matrix.arch }}

      - name: Export digest
        if: needs.resolve.outputs.push == 'true'
        run: |
          mkdir -p /tmp/digests
          echo "${{ steps.build.outputs.digest }}" > "/tmp/digests/${{ matrix.arch }}"

      - uses: actions/upload-artifact@v4
        if: needs.resolve.outputs.push == 'true'
        with:
          name: digests-${{ matrix.arch }}
          path: /tmp/digests/*
          retention-days: 1

  # Merge the per-arch image digests into one multi-arch manifest.
  merge:
    needs: [resolve, build]
    if: needs.resolve.outputs.push == 'true'
    runs-on: ubuntu-latest
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/ipa-decrypter
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create and push multi-arch manifest
        working-directory: /tmp/digests
        run: |
          IMAGE="${IMAGE,,}"
          args=()
          for f in *; do
            digest="$(cat "$f")"
            [ -n "$digest" ] && args+=("$IMAGE@${digest}")
          done
          tag_args=()
          while IFS= read -r tag; do
            [ -n "$tag" ] && tag_args+=("-t" "$tag")
          done < <(echo "$TAGS" | tr ',' '\n')
          docker buildx imagetools create "${tag_args[@]}" "${args[@]}"
        env:
          TAGS: ${{ needs.resolve.outputs.tags }}

      - name: Inspect image
        run: |
          IMAGE="${IMAGE,,}"
          first_tag="$(echo "$TAGS" | cut -d, -f1)"
          docker buildx imagetools inspect "$first_tag"
        env:
          TAGS: ${{ needs.resolve.outputs.tags }}
